apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8snonroot
spec:
  crd:
    spec:
      names:
        kind: K8sNonRoot
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8snonroot

        {
          container := input.review.object.spec.template.spec.container[_]''
          not container
        }

        violation[{"msg": msg}] {
          container := input.review.object.spec.template.spec.containers[_]

          not container.securityContext.runAsNonRoot

          msg := sprintf(
            "container %q must set runAsNonRoot=true",
            [container.name]
          )
        }

        violation[{"msg": msg}] {
          container := input.review.object.spec.template.spec.containers[_]

          container.securityContext.runAsUser == 0

          msg := sprintf(
            "container %q cannot run as UID 0",
            [container.name]
          )
        }

---

apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sNonRoot
metadata:
  name: require-non-root
spec:
  match:
    kinds:
      - apiGroups: ["apps"]
        kinds:
          - Deployment